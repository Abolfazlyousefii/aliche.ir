name: Homepage section visibility checks

on:
  pull_request:
    paths:
      - 'app/Http/Controllers/Admin/HomeSectionController.php'
      - 'app/Http/Controllers/Frontend/HomeController.php'
      - 'resources/views/admin/home_sections/index.blade.php'
      - 'resources/views/frontend/home.blade.php'
      - 'tests/Feature/Admin/HomeSectionVisibilityTest.php'
      - '.github/workflows/home-section-visibility.yml'
  push:
    branches: [main]
    paths:
      - 'app/Http/Controllers/Admin/HomeSectionController.php'
      - 'app/Http/Controllers/Frontend/HomeController.php'
      - 'resources/views/admin/home_sections/index.blade.php'
      - 'resources/views/frontend/home.blade.php'
      - '.github/workflows/home-section-visibility.yml'
  workflow_dispatch:

jobs:
  home-section-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, fileinfo, xml, zip
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare SQLite test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          mkdir -p storage/framework/{cache,sessions,views} bootstrap/cache
      - name: PHP syntax checks
        run: |
          php -l app/Http/Controllers/Admin/HomeSectionController.php
          php -l app/Http/Controllers/Frontend/HomeController.php
          php -l tests/Feature/Admin/HomeSectionVisibilityTest.php
      - name: Feature tests for visibility, permissions and sort persistence
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: vendor/bin/phpunit tests/Feature/Admin/HomeSectionVisibilityTest.php
      - name: Compile all Blade templates
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan view:cache
